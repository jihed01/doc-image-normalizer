[build-system]
requires = ["setuptools>=61,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-image-normalizer"
version = "0.1.0"
requires-python = ">=3.14,<3.15"

dependencies = [
    "opencv-python-headless>=5.0,<6.0",
    "numpy>=2.5,<3.0",
    "fastapi>=0.142,<1.0",
    "uvicorn>=0.54,<1.0",
    "pydantic>=2.13,<3.0",
    "python-multipart>=0.0.32,<1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10.0",
    "pytest-cov>=7.1,<8.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.16,<1.0",
    "black>=26.5,<27.0",
    "pre-commit>=4.6,<5.0",
    "mypy>=1.0,<2.0"
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]